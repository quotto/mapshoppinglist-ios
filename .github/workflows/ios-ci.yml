name: iOS CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: macos-14
    env:
      GOOGLE_MAPS_API_KEY: dummy-ci-key
      DESTINATION: platform=iOS Simulator,name=iPhone 15 Pro Max,OS=17.5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project MapShoppingList.xcodeproj -scheme MapShoppingList

      - name: Run unit tests
        run: Scripts/run-tests.sh
